name: ZBSwork Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-win-x64:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare packaging environment
        shell: cmd
        run: copy /Y apps\desktop\.env.windows.example apps\desktop\.env.windows

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Windows x64 (unsigned)
        working-directory: apps/desktop
        run: pnpm run package:win:x64:unsigned

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: zbswork-win-x64
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
